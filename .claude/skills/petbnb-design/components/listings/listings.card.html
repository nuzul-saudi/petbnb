<!-- @dsCard group="Components" viewport="700x420" name="Listings" subtitle="ListingCard · RoleCard" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); }
  .wrap { font-family: var(--font-body); padding: 22px; display: grid; grid-template-columns: 320px 1fr; gap: 22px; align-items: start; }
  .glabel { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--text-muted); direction: ltr; text-align: right; margin-bottom: 10px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ListingCard, RoleCard } = window.PetbnbDesignSystem_4fc49b;
function Demo() {
  const [role, setRole] = React.useState('owner');
  return (
    <div className="wrap">
      <div>
        <div className="glabel">ListingCard — sitter-first</div>
        <ListingCard
          hostName="نورة العتيبي" hostPhoto="../../assets/breeds/ragdoll.jpg"
          verified tier="gold" gender="female" district="الملقا" city="الرياض"
          distanceKm="٣٫٢" title="منزل دافئ وهادئ لقطتك مع رعاية شخصية"
          price="٤٥٠" maxPets="٢" coverPhoto="../../assets/breeds/maine_coon.jpg"
        />
      </div>
      <div>
        <div className="glabel">RoleCard — onboarding chooser</div>
        <div className="stack">
          <RoleCard role="owner" title="أبحث عن مكان لقطتي" desc="ابحثي عن مضيفة موثوقة قريبة منكِ" selected={role==='owner'} onPress={() => setRole('owner')} />
          <RoleCard role="host" title="أستضيف القطط في منزلي" desc="استقبلي الحيوانات واكسبي دخلاً" selected={role==='host'} onPress={() => setRole('host')} />
          <RoleCard role="both" title="كلاهما" desc="أحتاج كلا الدورين" selected={role==='both'} onPress={() => setRole('both')} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
