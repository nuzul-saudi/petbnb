<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); }
  .wrap { font-family: var(--font-body); padding: 22px; display: flex; flex-direction: column; gap: 20px; max-width: 420px; }
  .glabel { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--text-muted); direction: ltr; text-align: right; margin-bottom: 8px; }
  .rowflex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, FilterChip } = window.PetbnbDesignSystem_4fc49b;
function Demo() {
  const [name, setName] = React.useState('نورة العتيبي');
  const [fem, setFem] = React.useState(true);
  const [near, setNear] = React.useState(false);
  return (
    <div className="wrap">
      <div>
        <div className="glabel">Input</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Input label="الاسم الكامل" value={name} onChange={setName} placeholder="محمد العتيبي" />
          <Input label="العمر (بالأشهر)" placeholder="١٨" helper="أدخلي عمر القطة بالأشهر" />
          <Input label="رقم الجوال" value="+966 51 234 5678" error="رقم غير صحيح" />
        </div>
      </div>
      <div>
        <div className="glabel">FilterChip</div>
        <div className="rowflex">
          <FilterChip label="مضيفات فقط" active={fem} onPress={() => setFem(v => !v)} />
          <FilterChip label="الأقرب إليك" active={near} onPress={() => setNear(v => !v)} />
          <FilterChip label="يقبل أكثر من قطة" active={false} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
