<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces" subtitle="Warm sand/cream — never white" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">
  <div class="swatches">
    <div class="swatch"><div class="chip" style="background:var(--paper)"></div><span class="name">paper</span><span class="hex">#FFFCF5</span></div>
    <div class="swatch"><div class="chip" style="background:var(--cream)"></div><span class="name">cream</span><span class="hex">#FAF6EE</span></div>
    <div class="swatch"><div class="chip" style="background:var(--sand)"></div><span class="name">sand</span><span class="hex">#F5EFE6</span></div>
    <div class="swatch"><div class="chip" style="background:var(--whisper)"></div><span class="name">whisper</span><span class="hex">#E8DFCC</span></div>
    <div class="swatch"><div class="chip" style="background:var(--honey)"></div><span class="name">honey</span><span class="hex">#D4BC78</span></div>
  </div>
</div>
</body>
</html>
