<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Cards 16–22px · pill chips" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="card.css">
<style>
  .radii { display: flex; gap: 18px; align-items: flex-end; }
  .ra { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ra .box { width: 76px; height: 56px; background: var(--surface-sunken); border: 2px solid var(--moss); }
  .ra .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--text-muted); direction: ltr; }
</style>
</head>
<body>
<div class="card">
  <div class="radii">
    <div class="ra"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm 8</span></div>
    <div class="ra"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md 12</span></div>
    <div class="ra"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg 16 · button</span></div>
    <div class="ra"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl 22 · card</span></div>
    <div class="ra"><div class="box" style="width:56px;border-radius:var(--radius-pill)"></div><span class="lbl">pill</span></div>
  </div>
</div>
</body>
</html>
