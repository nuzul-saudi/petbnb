<!-- @dsCard group="Colors" viewport="700x190" name="Ink & expressive" subtitle="Warm near-black text + rare accents" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">
  <div class="swatches">
    <div class="swatch"><div class="chip" style="background:var(--ink)"></div><span class="name">ink</span><span class="hex">#1F2A1D</span></div>
    <div class="swatch"><div class="chip" style="background:var(--ink-soft)"></div><span class="name">ink-soft</span><span class="hex">#3D4A3A</span></div>
    <div class="swatch"><div class="chip" style="background:var(--terracotta)"></div><span class="name">terracotta</span><span class="hex">#B45842</span></div>
    <div class="swatch"><div class="chip" style="background:var(--rose)"></div><span class="name">rose</span><span class="hex">#D49389</span></div>
  </div>
</div>
</body>
</html>
