<!-- @dsCard group="Type" viewport="700x250" name="Tajawal — body" subtitle="Humanist Arabic sans · 400 / 500 / 700" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="card.css">
<style>
  .body-spec { font-family: var(--font-body); color: var(--text-body); }
  .lede { font-size: 16px; font-weight: 400; line-height: var(--leading-body); }
  .ws { display: flex; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
  .ws span { font-family: var(--font-body); font-size: 19px; color: var(--text-body); }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted); direction: ltr; text-align: right; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="body-spec lede">ابحثي عن مضيفة موثوقة بالقرب منكِ، واطمئني على قطتك بتحديثات يومية وصور طوال فترة الإقامة.</div>
  <div class="ws">
    <span style="font-weight:400">عادي 400</span>
    <span style="font-weight:500">وسط 500</span>
    <span style="font-weight:700">عريض 700</span>
  </div>
  <div class="meta">Tajawal · body copy, labels, buttons, inputs · line-height 1.6 for paragraphs</div>
</div>
</body>
</html>
