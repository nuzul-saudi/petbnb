<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark (placeholder)" subtitle="No final logo — Reem Kufi stand-in" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="card.css">
<style>
  .card { background: var(--cream); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px; }
  .mark { display: flex; align-items: center; gap: 12px; }
  .glyph {
    width: 52px; height: 52px; border-radius: var(--radius-lg);
    background: var(--moss); color: var(--cream);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-weight: 700; font-size: 30px;
    box-shadow: var(--shadow-card);
  }
  .word { font-family: var(--font-heading); font-weight: 700; font-size: 36px; color: var(--moss-deep); letter-spacing: .5px; direction: ltr; }
  .ar { font-family: var(--font-heading); font-weight: 500; font-size: 19px; color: var(--gold-deep); }
  .note { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <div class="glyph">P</div>
    <div class="word">Petbnb</div>
  </div>
  <div class="ar">رعاية القطط في الرياض</div>
  <div class="note">placeholder — public brand + Arabic name pending trademark</div>
</div>
</body>
</html>
