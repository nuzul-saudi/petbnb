<!-- @dsCard group="Brand" viewport="700x180" name="Glyph set" subtitle="The whole functional emoji vocabulary" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="card.css">
<style>
  .glyphs { display: flex; flex-wrap: wrap; gap: 22px; }
  .g { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
  .g .ico { font-size: 26px; }
  .g .ico.tick { color: var(--verified); font-family: var(--font-body); font-weight: 700; }
  .g .lbl { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="glyphs">
    <div class="g"><span class="ico tick">✓</span><span class="lbl">موثّق</span></div>
    <div class="g"><span class="ico">📍</span><span class="lbl">الموقع</span></div>
    <div class="g"><span class="ico">🐈</span><span class="lbl">قطة</span></div>
    <div class="g"><span class="ico">🏠</span><span class="lbl">منزل</span></div>
    <div class="g"><span class="ico">📥</span><span class="lbl">طلبات</span></div>
    <div class="g"><span class="ico">⚭</span><span class="lbl">كلاهما</span></div>
    <div class="g"><span class="ico">←</span><span class="lbl">رجوع</span></div>
  </div>
</div>
</body>
</html>
